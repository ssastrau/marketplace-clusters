---
- name: Writing deployment credentils locally
  blockinfile:
    path: '/home/{{ username }}/.deployment-secrets.txt'
    create: true
    owner: '{{ username }}'
    group: '{{ username }}'
    mode: '0644'
    block: |
      # system user
      username: {{ username }}
      password: {{ password }}

      # redis password
      redis-cli --askpass --tls --cacert /etc/redis/tls/ca.crt:
      {{ redis_password }}
  run_once: true
  delegate_to: "{{ groups['redis_primary'][0] }}"
