---
- name: Force ipv4 with apt
  copy:
    content: Acquire::ForceIPv4 "true";
    dest: /etc/apt/apt.conf.d/99force-ipv4
    mode: '0600'

- name: Update system packages
  import_role:
    name: update_pkgs

- name: Install basic packages
  apt:
    pkg:
      - ntp
      - wget
      - curl
      - htop
      - rsync
      - fail2ban
      - python3-pip
      - python3-pymysql
    state: present

- name: Create sudo user
  import_role:
    name: sudouser
  run_once: true
  delegate_to: localhost

- name: Set root password
  import_role:
    name: setrootpwd

- name: Add SSH public keys
  import_role:
    name: sshkey
  run_once: true
  delegate_to: localhost

- name: Disable root login
  import_role:
    name: securessh
  when: disable_root is defined

- name: Enabling fail2ban
  import_role:
    name: fail2ban_install
