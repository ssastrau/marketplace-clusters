---
- name: Update system packages
  import_role:
    name: update_pkgs

- name: Install basic packages
  apt:
    pkg:
      - net-tools
      - htop
      - rsync
      - fail2ban
      - ufw
      - software-properties-common
      - gnupg2
      - ssl-cert
      - openjdk-11-jdk
      - openjdk-11-jdk-headless
    state: present

# Set _domain variable
- name: Set _domain variable
  import_role:
    name: setdomain
  run_once: true
  delegate_to: localhost

# dns creation
- name: Create dns A record
  import_role:
    name: create_dns_record
  when:
    - token_password is defined
    - default_dns is not defined
  run_once: true
  delegate_to: localhost

- name: Create sudo user
  import_role:
    name: sudouser
  run_once: true
  delegate_to: localhost

- name: Set root password
  import_role:
    name: setrootpwd

- name: Add SSH public keys
  import_role:
    name: sshkey
  run_once: true
  delegate_to: localhost

- name: Disable root login
  import_role:
    name: securessh
  when: disable_root is defined

- name: Apply ufw rules
  import_tasks: ufw_rules.yml

- name: Enabling fail2ban
  import_role:
    name: fail2ban_install
