---
# roles/post/tasks/main.yml
- name: Create sudo user
  import_role:
    name: sudouser
  run_once: true
  delegate_to: localhost
  when: cluster_mode == "client" and is_provisioner == "true"

- name: Set root password
  import_role:
    name: setrootpwd
  when: cluster_mode == "client"

- name: Add SSH public keys
  import_role:
    name: sshkey
  run_once: true
  delegate_to: localhost
  when: cluster_mode == "client"

- name: Disable root login
  import_role:
    name: securessh
  when: disable_root is defined and cluster_mode == "client"

- name: Writing deployment credentils locally
  blockinfile:
    path: '/home/{{ username }}/.deployment-secrets.txt'
    create: true
    owner: '{{ username }}'
    group: '{{ username }}'
    mode: '0644'
    block: |
      # system user
      user: {{ username }}
      password: {{ password }}

      # hashi tokens
      consul_nomad_autojoin_token: {{ consul_nomad_autojoin_token }}
  run_once: true
  delegate_to: "{{ groups['nomad_client'][0] }}"
  when: cluster_mode == "client"
