---
# linode nomad ansible playbook

# linodes
- name: Configure nomad cluster
  hosts: all
  any_errors_fatal: true
  user: root
  vars:
    local_home: "{{ lookup('env','HOME') }}"
  vars_files: [group_vars/linode/vars, group_vars/linode/secret_vars]
  roles:
    - {role: 'common', tags: 'cluster'}
    - {role: 'consul', tags: 'cluster'}
    - {role: 'nomad', tags: 'cluster'}
    - post
